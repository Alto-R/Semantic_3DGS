# Copy this file to a machine-specific untracked config, for example:
# - configs/paths.local.yaml
# - configs/paths.cluster.yaml
#
# Keep large data outside Git.

machine: cluster

cluster:
  ssh_alias: haoqi
  root: ../..

paths:
  repo: .
  eyenavgs_data: ../../data/EyeNavGS
  gaussian_models: ../../data/3dgs_models
  external_repos: ../../external
  task1_outputs: ../../outputs/eyenavgs_task1

task1:
  pilot_scene: bicycle
  semantic_property: label
  unlabeled_id: 0
  render_view_count: 150
  baseline_method: FlashSplat
  refinement_method: SAGA
